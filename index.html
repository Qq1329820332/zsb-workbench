<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<title>2027 江西理工类专升本 · 备考工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<meta name="theme-color" content="#8b5cf6">
<style>
/* ============================================================
   1. 设计令牌:暖色卡片风 · 紫色主 + 粉/橙/绿点缀
   ============================================================ */
:root{
  --font-disp:'LXGW WenKai','Kaiti SC','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;
  --bg:#faf7ff; --card:#fdfcff; --border:#ece6f5; --line:#f3eef9;
  --text:#211a3a; --sub:#6a6488; --dim:#746d97;
  --pri:#7a4cf0; --pri2:#a78bfa; --pri-soft:#f3edff; --pri-border:rgba(139,92,246,.18);
  --pink:#ec4899; --pink-soft:#fdf2f8;
  --warm:#f59e0b; --warm-soft:#fff5e1;
  --mint:#10b981; --mint-soft:#e7faf3;
  --danger:#dc2626;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --tx:all .18s cubic-bezier(.4,.0,.2,1);
  --shadow-1:0 1px 3px rgba(31,23,51,.04),0 2px 10px rgba(31,23,51,.04);
  --shadow-2:0 6px 24px rgba(139,92,246,.10),0 2px 8px rgba(31,23,51,.05);
  --shadow-3:0 12px 40px rgba(139,92,246,.18);
  --grad-pri:linear-gradient(135deg,#8b5cf6 0%,#a78bfa 50%,#ec4899 100%);
  --grad-pri-soft:linear-gradient(135deg,#f3edff 0%,#fdf2f8 100%);
  --grad-warm:linear-gradient(135deg,#f59e0b 0%,#ec4899 100%);
  --grad-mint:linear-gradient(135deg,#10b981 0%,#8b5cf6 100%);
  /* ✨ 炫酷特效令牌 */
  --glow-pri:0 0 24px rgba(139,92,246,.45);
  --glow-pink:0 0 24px rgba(236,72,153,.35);
  --glass:rgba(255,255,255,.62);
  --glass-bd:rgba(255,255,255,.5);
  --ring-grad:linear-gradient(135deg,#8b5cf6,#ec4899,#10b981);
}
/* ============================================================ */

/* === 2. 全局 reset + 排版 === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:
  radial-gradient(600px 420px at 88% -5%,rgba(139,92,246,.08),transparent 70%),
  radial-gradient(520px 400px at -12% 32%,rgba(236,72,153,.05),transparent 70%),
  radial-gradient(580px 440px at 112% 68%,rgba(16,185,129,.05),transparent 70%),
  linear-gradient(180deg,#faf7ff 0%,#f5f0ff 100%);
  background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(40% 55% at 12% 18%,rgba(139,92,246,.16),transparent 60%),
    radial-gradient(38% 50% at 88% 22%,rgba(236,72,153,.12),transparent 60%),
    radial-gradient(45% 60% at 70% 88%,rgba(16,185,129,.12),transparent 60%);
  animation:auroraShift 18s ease-in-out infinite alternate}
@keyframes auroraShift{0%{background-position:0% 0%,0% 0%,0% 0%}100%{background-position:120% 80%,-60% 60%,80% -40%}}
.bg-orb{position:fixed;border-radius:50%;filter:blur(56px);opacity:.42;z-index:-1;pointer-events:none;mix-blend-mode:screen;animation:orbFloat 16s ease-in-out infinite}
.bg-orb.a{width:340px;height:340px;top:-60px;left:-40px;background:radial-gradient(circle,rgba(139,92,246,.55),transparent 70%)}
.bg-orb.b{width:300px;height:300px;bottom:-40px;right:-30px;background:radial-gradient(circle,rgba(236,72,153,.5),transparent 70%);animation-delay:-6s}
.bg-orb.c{width:260px;height:260px;top:40%;right:8%;background:radial-gradient(circle,rgba(16,185,129,.45),transparent 70%);animation-delay:-11s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.12)}66%{transform:translate(-30px,25px) scale(.92)}}
::selection{background:rgba(139,92,246,.22)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.26);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,.5);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
h1,h2,.hero-brand .t,.card h2,.subject-card .sn,.motto,.cd-card .nm,.timer .num{font-family:var(--font-disp)}
h1{font-size:22px;font-weight:800}h2{font-size:17px;font-weight:700}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--text);outline:none}
a{color:var(--pri);text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* === 3. 顶部 Hero Header(渐变大圆角) === */
.top-hero{background:var(--grad-pri);color:#fff;padding:22px 28px 28px;border-radius:0 0 var(--r-xl) var(--r-xl);box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.top-hero::before{content:"";position:absolute;top:-40%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.top-hero::after{content:"";position:absolute;bottom:-70px;left:6%;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 70%);pointer-events:none}
.top-hero .hero-row,.top-hero .hero-stats{position:relative;z-index:1}
.hero-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.hero-brand{display:flex;align-items:center;gap:12px}
.hero-brand .ico{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.hero-brand .t{font-size:18px;font-weight:800;letter-spacing:.5px}
.hero-brand .s{font-size:12px;opacity:.85;margin-top:2px}
.hero-actions{display:flex;gap:8px;align-items:center}
.hero-actions .iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;cursor:pointer;transition:var(--tx)}
.hero-actions .iconbtn:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
#checkinBtn{animation:checkinPulse 2.4s ease-in-out infinite}
@keyframes checkinPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.hero-actions .checkin{background:#fff;color:var(--pri);border:none;border-radius:12px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;transition:var(--tx)}
.hero-actions .checkin:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.hero-stats{display:flex;gap:24px;margin-top:18px;flex-wrap:wrap}
.hero-stats .item{display:flex;align-items:baseline;gap:8px}
.hero-stats .v{font-size:clamp(30px,5.5vw,40px);font-weight:900;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hero-stats .v.gold{background:linear-gradient(180deg,#fde68a,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero-stats .v.pink{background:linear-gradient(180deg,#fbcfe8,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero-stats .v.mint{background:linear-gradient(180deg,#a7f3d0,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero-stats .l{font-size:12px;opacity:.85}
.hero-prog{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11.5px;opacity:.95;position:relative;z-index:1}
.hero-prog b{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.hp-bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.hp-bar i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#fff);border-radius:99px;transition:width .8s ease}

/* === 4. 主体容器 + 二级导航(大圆角胶囊) === */
.grad-text{background:var(--grad-pri);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.neon{box-shadow:var(--glow-pri);border-radius:var(--r-md)}
.fx-reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.25,1,.5,1),transform .6s cubic-bezier(.25,1,.5,1)}
.fx-reveal.in{opacity:1;transform:none}
.app{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.app>*{animation:cardIn .5s cubic-bezier(.25,1,.5,1) both}
.app>*:nth-child(1){animation-delay:.02s}.app>*:nth-child(2){animation-delay:.07s}
.app>*:nth-child(3){animation-delay:.12s}.app>*:nth-child(4){animation-delay:.17s}
.app>*:nth-child(5){animation-delay:.22s}.app>*:nth-child(6){animation-delay:.27s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:6px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.tabs button{flex:1;min-width:80px;padding:11px 14px;border-radius:var(--r-md);font-size:13px;font-weight:600;color:var(--sub);background:transparent;border:none;cursor:pointer;transition:var(--tx);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button:hover{background:var(--pri-soft);color:var(--pri);transform:translateY(-1px)}
.tabs button.active{background:var(--grad-pri);color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.32);transform:translateY(-1px)}
.tabs button.active span{display:inline-block;animation:tabPop .3s ease}
@keyframes tabPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* === 5. 卡片组件 === */
.card{background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-1);transition:var(--tx);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);opacity:.6}
.card:hover{box-shadow:var(--shadow-2);transform:translateY(-2px)}
.card.gradient-pri{background:var(--grad-pri-soft);border-color:rgba(139,92,246,.18)}
.card h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .ic{font-size:16px;width:30px;height:30px;border-radius:9px;background:var(--pri-soft);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--pri-border)}
.card.gradient-pri h2 .ic{background:rgba(139,92,246,.13);box-shadow:inset 0 0 0 1px rgba(139,92,246,.22)}

/* === 5.5 今日状态主卡(首页) === */
.sec-title{margin:20px 0 12px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-title .ic{font-size:22px}
.today-card{background:linear-gradient(135deg,#f3edff 0%,#fdf2f8 55%,#fff5e1 100%);border:none;position:relative;overflow:hidden}
.today-card::before{content:"";position:absolute;top:-50px;right:-30px;width:190px;height:190px;background:radial-gradient(circle,rgba(139,92,246,.12),transparent 70%);pointer-events:none}
.today-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:relative}
.today-date{display:flex;align-items:baseline;gap:8px}
.td-d{font-size:20px;font-weight:800;font-family:var(--font-disp)}
.td-w{font-size:12px;color:var(--sub)}
.today-tip{font-size:12.5px;color:var(--sub);margin:10px 0 14px;line-height:1.6;position:relative}
.today-tip b{color:var(--warm)}
.today-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.tstat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.72);border:1px solid rgba(139,92,246,.12);border-radius:14px;padding:11px 12px;transition:var(--tx)}
.tstat:hover{transform:translateY(-2px);box-shadow:var(--shadow-1)}
.tstat .tic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tstat .t1{background:var(--pri-soft)}.tstat .t2{background:var(--pink-soft)}.tstat .t3{background:var(--warm-soft)}.tstat .t4{background:var(--mint-soft)}
.tstat b{font-size:17px;font-weight:800;display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.tstat em{font-size:10.5px;color:var(--sub);font-style:normal}
@media (max-width:560px){.today-stats{grid-template-columns:repeat(2,1fr)}}
body[data-theme="dark"] .today-card{background:linear-gradient(135deg,#241e3a 0%,#2a2138 60%,#3a2c1d 100%)}
body[data-theme="dark"] .tstat{background:rgba(255,255,255,.06);border-color:rgba(167,139,250,.15)}

/* === 6. 学科入口大卡(主页用) === */
.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.subject-card{position:relative;padding:18px 18px 28px;border-radius:var(--r-lg);color:#fff;overflow:hidden;cursor:pointer;transition:var(--tx);border:none;text-align:left;width:100%;font-family:inherit}
.subject-card .si{font-size:32px;margin-bottom:6px;display:block}
.subject-card .sn{font-size:16px;font-weight:800;margin-bottom:4px;display:block}
.subject-card .sd{font-size:11px;opacity:.92;line-height:1.5;display:block}
.subject-card .sp{position:absolute;right:12px;top:12px;font-size:11px;background:rgba(255,255,255,.24);padding:2px 9px;border-radius:99px;font-weight:700}
.subject-card .pg-mini{position:absolute;left:18px;right:18px;bottom:14px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.subject-card .pg-mini i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.subject-card.math{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}
.subject-card.eng{background:linear-gradient(135deg,#ec4899,#f472b6)}
.subject-card.ict{background:linear-gradient(135deg,#10b981,#34d399)}
.subject-card.poli{background:linear-gradient(135deg,#f59e0b,#fb923c)}
.subject-card::after{content:"";position:absolute;top:-40%;left:-25%;width:70%;height:190%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.24),transparent);transform:skewX(-20deg) translateX(-130%);transition:transform .6s ease;pointer-events:none}
.subject-card:hover::after{transform:skewX(-20deg) translateX(230%)}
.subject-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 40px rgba(139,92,246,.35),var(--glow-pri)}
.subject-card:active{transform:translateY(-1px) scale(.99)}

/* === 7. 工具入口小卡 === */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tool-card{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:var(--tx);border-width:1px;border-style:solid;font-family:inherit}
.tool-card:hover{border-color:var(--pri-border);box-shadow:var(--shadow-1);transform:translateY(-2px)}
.tool-card:hover .ti{transform:scale(1.12) rotate(-4deg);transition:transform .2s ease}
.tool-card .ti{width:36px;height:36px;border-radius:10px;background:var(--pri-soft);display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .2s ease}
.tool-card.gradient .ti{background:linear-gradient(135deg,#fdf2f8,#f3edff);color:var(--pri)}
.tool-card.warm .ti{background:linear-gradient(135deg,#fff5e1,#fdf2f8);color:var(--warm)}
.tool-card.mint .ti{background:linear-gradient(135deg,#e7faf3,#ecfeff);color:var(--mint)}
.tool-card .info{flex:1;min-width:0}
.tool-card .tn{font-size:13px;font-weight:600;line-height:1.3}
.tool-card .td{font-size:11px;color:var(--sub);margin-top:1px}

/* === 8. 统计区 === */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat-card{text-align:center;padding:14px 10px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);transition:var(--tx)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-1)}
.stat-card .v{font-size:22px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.stat-card.warm .v{color:var(--warm)}
.stat-card.mint .v{color:var(--mint)}
.stat-card.pink .v{color:var(--pink)}
.stat-card .k{font-size:11px;color:var(--sub);margin-top:3px}

/* === 9. 章节卡 === */
.chap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:9px;transition:var(--tx)}
.chap:hover{border-color:var(--pri-border);box-shadow:var(--shadow-1)}
.chap.done{background:linear-gradient(90deg,var(--mint-soft),transparent 55%);border-color:rgba(16,185,129,.28)}
.chap.done .nm{color:var(--dim);text-decoration:line-through}
.chap.done .bar i{background:linear-gradient(90deg,var(--mint),#059669)}
.chap .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chap .nm{font-size:13.5px;font-weight:700;flex:1}
.chap .cb{width:18px;height:18px;border:2px solid var(--dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;font-size:10px}
.chap .cb.on{background:var(--mint);border-color:var(--mint);color:#fff}
.chap .sub{font-size:12px;color:var(--sub);line-height:1.55;margin-bottom:8px}
.chap .pg{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--sub)}
.chap .bar{flex:1;height:6px;border-radius:4px;background:var(--bg);overflow:hidden}
.chap .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pink));border-radius:4px;transition:width .4s ease;position:relative;overflow:hidden}
.chap .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:barShine 2.4s ease-in-out infinite}
@keyframes barShine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.chap .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.chap .row input{border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12px;background:var(--bg)}
.chap .row input[type=number]{width:64px}

/* === 9.5 实用工具类(布局补全) === */
.w-full{width:100%;box-sizing:border-box}
.flex-1{flex:1;min-width:0}
.mt-xs{margin-top:10px}
.f{margin-bottom:10px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .f{flex:1;min-width:150px}
.search-box{margin-bottom:10px}
.search-box .input{width:100%}
.word-card .en{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.word-card .spk{background:transparent;border:none;font-size:11px;color:var(--dim);cursor:pointer;padding:0;line-height:1;transition:var(--tx)}
.word-card .spk:hover{color:var(--pri);transform:scale(1.15)}
.word-card.test-reveal .cn{cursor:pointer}
.word-card.test-reveal .cn:hover{color:var(--pri)}

/* === 10. 按钮/输入 === */
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;transition:var(--tx);position:relative;overflow:hidden}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pink));border:none;color:#fff;font-weight:700}
.btn-pri:hover{box-shadow:0 8px 20px rgba(139,92,246,.35);color:#fff;transform:translateY(-1px)}
.btn-pri:active{transform:translateY(0) scale(.97)}
.input{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 12px;font-size:13px;transition:var(--tx)}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-border)}
.textarea{min-height:60px;resize:vertical;line-height:1.6}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600}
.chip-pri{background:var(--pri-soft);color:var(--pri);border:1px solid var(--pri-border)}
.chip-warm{background:var(--warm-soft);color:var(--warm);border:1px solid rgba(245,158,11,.25)}
.chip-mint{background:var(--mint-soft);color:var(--mint);border:1px solid rgba(16,185,129,.25)}
.chip-pink{background:var(--pink-soft);color:var(--pink);border:1px solid rgba(236,72,153,.25)}
.chip-high{background:linear-gradient(135deg,#fde68a,#fbcfe8)!important;color:#7c2d12!important;border:1px solid #f59e0b!important;font-weight:700;animation:chipGlow 2s ease-in-out infinite}
@keyframes chipGlow{0%,100%{box-shadow:0 0 4px rgba(245,158,11,.3)}50%{box-shadow:0 0 10px rgba(245,158,11,.6)}}

/* === 11. 清单 === */
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:none}
.check .box{width:18px;height:18px;border:2px solid var(--dim);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;font-size:10px}
.check .box.on{background:var(--mint);border-color:var(--mint);color:#fff}
.check.done .tx{color:var(--dim);text-decoration:line-through}
.check .rm{color:var(--dim);background:transparent;border:none;font-size:13px;margin-left:auto;cursor:pointer}
.check .rm:hover{color:var(--danger)}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row .input{flex:1}

/* === 12. 词库卡片 === */
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.word-card{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);transition:var(--tx)}
.word-card:hover{border-color:var(--pri-border);box-shadow:var(--shadow-1);transform:translateY(-2px)}
.word-card .en{font-size:13px;font-weight:700}
.word-card .ph{font-size:11px;color:var(--sub);margin:2px 0}
.word-card .cn{font-size:11px;color:var(--dim)}
.word-card .bot{display:flex;justify-content:space-between;margin-top:6px}
.word-card .fave{background:transparent;border:none;font-size:14px;color:var(--dim);cursor:pointer}
.word-card .fave.on{color:var(--warm)}
.word-grid.test-mode .word-card .cn{filter:blur(6px);cursor:pointer;transition:filter .15s}
.word-grid.test-mode .word-card.reveal .cn{filter:blur(0)}

/* === 13. 复盘/新闻卡 === */
.rev{border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:var(--r-md);padding:12px 14px;margin-bottom:9px;background:var(--card)}
.rev .rt{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:11px;color:var(--sub)}
.rev .line{font-size:12.5px;line-height:1.65;white-space:pre-wrap}
.rev .line b{color:var(--sub);font-size:11px}
.news-item{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:7px;background:var(--card);transition:var(--tx)}
.news-item:hover{border-color:var(--pri-border)}
.news-item .t{font-size:13px;font-weight:600;line-height:1.5}
.news-item .p{font-size:11.5px;color:var(--pri);margin-top:4px}

/* === 14. 复盘复习卡片 === */
.rev-card{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;margin-bottom:9px;background:var(--card)}
.rev-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.rev-card .head .dt{font-size:11px;color:var(--sub)}
.rev-card .body{font-size:12.5px;line-height:1.7;white-space:pre-wrap}
.rev-card .body b{color:var(--sub);font-size:11px;margin-right:4px}

/* === 15. 计时器(环形进度) === */
.timer{text-align:center;padding:24px}
.ring-wrap{position:relative;width:min(250px,68vw);margin:0 auto}
.ring{width:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.ring-bg{stroke:var(--pri-soft)}
.ring-fg{stroke:url(#fGrad);stroke-dasharray:653.45;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.timer .num{font-size:clamp(40px,9vw,56px);font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;letter-spacing:-2px}
.ring-tip{font-size:12px;color:var(--sub)}
.timer .ctrls{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* === 16. 励志短句 === */
.motto{position:relative;text-align:center;padding:22px 42px;font-size:13.5px;color:var(--sub);font-style:italic;line-height:1.8}
.motto::before{content:"“";position:absolute;left:18px;top:8px;font-size:36px;line-height:1;color:var(--pri2);opacity:.45;font-family:Georgia,'Times New Roman',serif}
.motto::after{content:"”";position:absolute;right:18px;bottom:-2px;font-size:36px;line-height:1;color:var(--pri2);opacity:.45;font-family:Georgia,'Times New Roman',serif}

/* === 17. Toast === */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:999;animation:toastIn .2s ease;box-shadow:var(--shadow-2)}
.toast.toast-ok{background:linear-gradient(135deg,var(--mint),#059669)}
.toast.toast-err{background:linear-gradient(135deg,#ef4444,#dc2626)}
.toast.toast-warn{background:linear-gradient(135deg,var(--warm),#ea580c)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* === 18. 空状态 === */
.empty{text-align:center;padding:36px 16px;color:var(--dim);font-size:13px}
.empty .emo{font-size:36px;margin-bottom:8px;opacity:.6}

/* === 19. 倒数日 === */
.cd-list{display:grid;gap:10px}
.cd-card{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);gap:12px;transition:var(--tx)}

.cd-card .v2{font-size:26px;font-weight:800;color:var(--pri);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* === 20. 深色模式 === */

<script>

function pad(n){return n<10?"0"+n:""+n}

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function daysUntil(ds){var t=new Date(ds.replace(/-/g,"/")+" 23:59:59").getTime();return Math.ceil((t-Date.now())/(1000*60*60*24))}
var EXAM="2027-03-28";

/* ===== 主导航(6 大区) ===== */
var NAV=[
 {id:"home",   ic:"🏠",n:"总览"},

/* ===== 学科内二级导航 ===== */

 {id:"math",cls:"math",ic:"📐",n:"高数",sub:"函数极限→二重积分"},
 {id:"eng", cls:"eng", ic:"📖",n:"英语",sub:"词汇+阅读+完形+翻译(江西不考听力)"},

/* ===== Top Hero(固定展示,含倒计时+打卡) ===== */
function renderTopHero(){
  var d=daysUntil(EXAM);

  /* 本周(周一~周日)打卡天数 */
  var now=new Date(),dow=(now.getDay()+6)%7;

  var themed=document.body.dataset.theme||"auto";

    +'<div class="hero-actions">'
    +(checked
      ?'<button class="iconbtn" id="checkinBtn" title="今日已打卡" style="background:rgba(16,185,129,.45);border-color:rgba(255,255,255,.5)">✓</button>'
      :'<button class="iconbtn" id="checkinBtn" title="今日打卡">✓</button>')

    +'</div></div>'
    +'<div class="hero-stats">'
    +'<div class="item"><div class="v gold">'+d+'</div><div class="l">天 · '+EXAM+' 考试</div></div>'
    +'<div class="item"><div class="v pink">'+ds.n+'</div><div class="l">连续打卡'+(checked?' · 今日已打':'')+'</div></div>'
    +'<div class="item"><div class="v mint">'+wk+'</div><div class="l">本周打卡 /7 天</div></div>'

  document.getElementById("topHero").innerHTML=html;

    if(s.d===today){toast("今天已经打过卡啦,明天再来","warn");return}
    if(s.d===ystr){s.n=(s.n||0)+1}else{s.n=1} /* 连续则+1,断签重置 */

  _saveDrafts();

  });
}

  var el=document.createElement("div");el.className="toast"+(type?" toast-"+type:"");el.textContent=msg;document.body.appendChild(el);
  _toastT=setTimeout(function(){el.remove()},2200);
}

/* ============================================================
   主页(总览):4 大学科大卡 + 工具网格 + 数据统计
   ============================================================ */
register("home",function(){
  var m=load("zsb4_math",{});var md=0,mp=0;Object.keys(m).forEach(function(k){if(m[k].done)md++;mp+=(+m[k].prob||0)});

function ensureChapter(key,chaps){
  /* 只补缺失的默认章节,绝不清空已存数据(含用户自定义章节) */
  var st=load(key,null)||{};
  var changed=false;
  chaps.forEach(function(c,i){
    if(!st[i]||typeof st[i]!=="object"||st[i].prog===undefined){
      st[i]={done:false,prog:0,prob:0,wrong:""};changed=true;
    }
  });
  if(changed)save(key,st);
  return st;
}
function subjectPage(title,key,chaps,desc){
  var st=ensureChapter(key,chaps);
  var dn=0,pb=0,wg=0;Object.keys(st).forEach(function(k){if(st[k].done)dn++;pb+=(+st[k].prob||0);if(st[k].wrong)wg++});
  var parts=[
    '<div class="card gradient-pri"><h2 style="color:var(--pri)"><span class="ic">'+title.split(" ")[0]+'</span>'+title.split(" ").slice(1).join(" ")+'</h2>',
    '<p style="font-size:13px;color:var(--sub);line-height:1.65">'+desc+'</p>',
    '<div class="stats-grid" style="margin-top:14px">',
      '<div class="stat-card"><div class="v">'+dn+'/'+chaps.length+'</div><div class="k">已完成</div></div>',
      '<div class="stat-card warm"><div class="v">'+pb+'</div><div class="k">习题</div></div>',
      '<div class="stat-card pink"><div class="v">'+wg+'</div><div class="k">错题</div></div>',
    '</div></div>',
    '<div class="card gradient-pri"><h2><span class="ic">📚</span>章节列表</h2>'
  ];
  chaps.forEach(function(c,i){
    var sti=st[i]||{};var pct=sti.prog||0;
    var cls=c.sc&&c.sc.indexOf("39")!==-1?"chip-high":"chip-pri";
    parts.push('<div class="chap'+(sti.done?' done':'')+'" data-i="'+i+'"><div class="top"><span class="cb'+(sti.done?' on':'')+'" title="标记完成">✓</span><span class="nm">'+esc(c.n)+'</span><span class="chip '+cls+'">'+esc(c.sc||"")+'</span></div>'
      +(c.sub?'<div class="sub">'+esc(c.sub)+'</div>':'')
      +'<div class="pg"><span style="width:36px;flex-shrink:0">进度</span><div class="bar"><i style="width:'+pct+'%"></i></div><span style="width:42px;text-align:right;flex-shrink:0">'+pct+'%</span></div>'
      +'<div class="row"><span style="width:36px;flex-shrink:0">习题</span><input type="number" class="in-prob" min="0" value="'+(sti.prob||0)+'" data-i="'+i+'"><span style="margin-left:8px;width:50px;flex-shrink:0">错题</span><input type="text" class="in-wrong" placeholder="例:换元忘改限" value="'+esc(sti.wrong||"")+'" data-i="'+i+'"></div></div>');
  });
  /* 用户自定义章节(可添加/删除) */
  Object.keys(st).forEach(function(k){
    if(/^\d+$/.test(k))return;
    var c2=st[k]||{},pct2=c2.prog||0;
    parts.push('<div class="chap'+(c2.done?' done':'')+'" data-i="'+k+'"><div class="top"><span class="cb'+(c2.done?' on':'')+'" title="标记完成">✓</span><span class="nm">'+esc(c2.n||"自定义章节")+'</span><span class="chip chip-pink">自定义</span></div>'
      +'<div class="sub">自行添加的章节 · 可正常记录进度/习题/错题</div>'
      +'<div class="pg"><span style="width:36px;flex-shrink:0">进度</span><div class="bar"><i style="width:'+pct2+'%"></i></div><span style="width:42px;text-align:right;flex-shrink:0">'+pct2+'%</span></div>'
      +'<div class="row"><span style="width:36px;flex-shrink:0">习题</span><input type="number" class="in-prob" min="0" value="'+(c2.prob||0)+'" data-i="'+k+'"><span style="margin-left:8px;width:50px;flex-shrink:0">错题</span><input type="text" class="in-wrong" placeholder="例:换元忘改限" value="'+esc(c2.wrong||"")+'" data-i="'+k+'"><button class="btn" data-cdel="'+k+'" style="padding:2px 8px;font-size:11px;border-color:var(--danger);color:var(--danger);margin-left:auto">删除</button></div></div>');
  });
  parts.push('<div class="add-row"><input id="'+key+'_add" placeholder="添加自定义章节"><button class="btn btn-pri" id="'+key+'_addBtn">+</button></div></div>');
  return parts.join("");
}
function bindSubject(key){
  document.querySelectorAll(".chap").forEach(function(el){
    var i=el.dataset.i;var st2=load(key,{}); /* 字符串 key,兼容自定义章节 */
    var cb=el.querySelector(".cb");if(cb)cb.addEventListener("click",function(){
      st2[i]=st2[i]||{};st2[i].done=!st2[i].done;if(st2[i].done)st2[i].prog=100;save(key,st2);showPage(currentPage);
    });
    el.querySelector(".bar").addEventListener("click",function(){
      st2[i]=st2[i]||{};var p=(st2[i].prog||0);p=p>=100?0:p>=50?100:50;st2[i].prog=p;if(p>=100)st2[i].done=true;save(key,st2);showPage(currentPage);
    });
    el.querySelector(".in-prob").addEventListener("change",function(){st2[i]=st2[i]||{};st2[i].prob=+this.value||0;save(key,st2)});
    el.querySelector(".in-wrong").addEventListener("change",function(){st2[i]=st2[i]||{};st2[i].wrong=this.value;save(key,st2)});
  });
  /* 删除自定义章节 */
  document.querySelectorAll("[data-cdel]").forEach(function(b){
    b.addEventListener("click",function(){
      if(!confirm("删除这个自定义章节?进度将一并删除"))return;
      var st=load(key,{});delete st[b.dataset.cdel];save(key,st);showPage(currentPage);
    });
  });
  var add=document.getElementById(key+"_addBtn");
  if(add)add.addEventListener("click",function(){
    var v=document.getElementById(key+"_add").value.trim();if(!v)return;
    var st=load(key,{});var nk="x"+Date.now();st[nk]={done:false,prog:0,prob:0,wrong:""};st[nk].n=v;save(key,st);showPage(currentPage);
  });
}

var ENG_QUIZ=[
 {q:"She ___ to school every day.",opts:["goes","go","going","went"],a:0,r:"一般现在时,主语第三人称单数动词加 -s"},
 {q:"They ___ a movie when I called them.",opts:["watch","watched","were watching","are watching"],a:2,r:"when 引导过去时间点,用过去进行时 were/was+doing"},
 {q:"The book ___ by Lu Xun.",opts:["wrote","was written","writes","writing"],a:1,r:"书是被写的,一般过去时被动:was/were+过去分词"},
 {q:"I don't know ___ he will come.",opts:["if","what","which","whose"],a:0,r:"if 引导宾语从句,表示\"是否\""},
 {q:"It's important ___ English every day.",opts:["to practice","practice","practicing","practiced"],a:0,r:"It's+形容词+to do sth 固定句型"},
 {q:"He is ___ tired ___ he can't walk.",opts:["so...that","too...to","such...that","enough...to"],a:0,r:"so+形/副+that+从句:\"如此...以致于...\""},
 {q:"The teacher asked us ___ quiet.",opts:["to be","be","being","been"],a:0,r:"ask sb to do sth:要求某人做某事"},
 {q:"___ you work hard, you will pass the exam.",opts:["If","Although","Because","Unless"],a:0,r:"if 引导条件句:\"如果...就...\""},
 {q:"There ___ a lot of water in the river.",opts:["is","are","were","have"],a:0,r:"water 是不可数名词,be 动词用单数 is"},
 {q:"This is the book ___ I bought yesterday.",opts:["that","who","whom","whose"],a:0,r:"先行词是物,关系代词用 that/which"},
 {q:"She has lived here ___ 2010.",opts:["since","for","in","at"],a:0,r:"since+时间点,与现在完成时连用"},
 {q:"He suggested that we ___ early.",opts:["leave","left","leaving","leaves"],a:0,r:"suggest 后从句用虚拟语气:(should+)动词原形"},
 {q:"Not until midnight ___ back home.",opts:["did he go","he went","he goes","went he"],a:0,r:"Not until 位于句首,主句要部分倒装"},
 {q:"The more you read, ___ you will be.",opts:["the better","better","the good","good"],a:0,r:"the+比较级...,the+比较级...:越...越..."},
 {q:"I'm looking forward to ___ you.",opts:["seeing","see","saw","seen"],a:0,r:"look forward to 中 to 是介词,后接动名词 doing"}
];

      box.innerHTML=h;

    +'<div class="card" id="gameBox"><div class="empty"><div class="emo">🎲</div>选一个游戏开练<br><span style="font-size:11px;color:var(--dim)">记忆翻牌 · 单词快答 · 连连消，玩着背单词</span></div></div>';
},function(){

    b.addEventListener("click",function(){startGame(b.dataset.game)});
  });

/* 抽 6 个随机单词 */
function pickWords(n){
  var pool=[];for(var i=0;i<WORDS_BASE.length;i++)pool.push(i);
  pool.sort(function(){return Math.random()-.5});
  return pool.slice(0,n).map(function(i){return {wi:i,w:WORDS_BASE[i]}});
}
function startGame(type){
  var box=document.getElementById("gameBox");
  if(type==="flip")renderFlip(box);
  else if(type==="quiz")renderQuiz(box);
  else renderMatch(box);
}
/* 游戏记录:各游戏最高分 */
function gameBest(key,val){
  var g=load("zsb5_games",{});
  if(val!==undefined){
    if(val>=(g[key]||0)){g[key]=val;save("zsb5_games",g);return true}
    return false;
  }
  return g[key]||0;
}

function renderFlip(box){
  var pairs=pickWords(6);
  var best=gameBest("flip");
  var deck=[];
  pairs.forEach(function(p){deck.push({wi:p.wi,ty:"en",w:p.w.en});deck.push({wi:p.wi,ty:"cn",w:p.w.cn})});
  deck.sort(function(){return Math.random()-.5});
  var st={f1:null,lock:false,matched:0,moves:0};
  var h='<h2 style="margin-bottom:8px"><span class="ic">🃏</span>记忆翻牌 <span id="fpStat" style="font-size:13px;color:var(--sub);font-weight:400">已配 0/6 · 步数 0</span></h2>'
    +'<p style="font-size:12px;color:var(--sub);margin-bottom:12px">翻开两张,英文配中文,全部配对就赢!'+(best?' · 🏆最佳 '+best+' 步':'')+'</p>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
  deck.forEach(function(d,i){
    h+='<div class="fcard" data-i="'+i+'" style="aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pink));color:#fff;user-select:none;transition:var(--tx)">🃏</div>';
  });
  h+='</div><div style="text-align:center;margin-top:12px"><button class="btn" id="fpRestart">🔄 重新开始</button></div>';
  box.innerHTML=h;
  var cards=box.querySelectorAll(".fcard");
  function updStat(){document.getElementById("fpStat").textContent="已配 "+st.matched+"/6 · 步数 "+st.moves}
  function flipBack(a,b){
    setTimeout(function(){
      cards[a].textContent="🃏";cards[a].style.background="linear-gradient(135deg,var(--pri),var(--pink))";cards[a].style.color="#fff";
      cards[b].textContent="🃏";cards[b].style.background="linear-gradient(135deg,var(--pri),var(--pink))";cards[b].style.color="#fff";
      st.lock=false;
    },650);
  }
  cards.forEach(function(el){
    el.addEventListener("click",function(){
      if(st.lock)return;
      var i=+el.dataset.i,d=deck[i];
      if(el.textContent!=="🃏"||el.style.opacity==="0.25")return;
      el.textContent=d.w;el.style.background="var(--card)";el.style.color="var(--text)";
      if(!st.f1){st.f1=i;return}
      var f=deck[st.f1];st.moves++;updStat();
      if(f.wi===d.wi&&f.ty!==d.ty){
        st.matched++;updStat();
        cards[st.f1].style.opacity="0.25";el.style.opacity="0.25";st.f1=null;
        if(st.matched===6){setTimeout(function(){var isNew=gameBest("flip",st.moves);toast("🎉 全配对了!用了 "+st.moves+" 步"+(isNew?" · 🏆 新纪录!":""),"ok")},200)}
      }else{
        var a=st.f1;st.f1=null;st.lock=true;flipBack(a,i);
      }
    });
  });
  document.getElementById("fpRestart").addEventListener("click",function(){renderFlip(box)});
}

function renderQuiz(box){
  var round=pickWords(10);
  var best=gameBest("quiz");
  var st={i:0,score:0,streak:0};
  function build(){
    if(st.i>=round.length){
      var isNew=gameBest("quiz",st.score);
      box.innerHTML='<h2 style="text-align:center;margin-bottom:10px">🎉 完成!</h2>'
        +'<div style="text-align:center;font-size:20px;font-weight:800;color:var(--pri);margin-bottom:6px">'+st.score+' / 10 题'+(isNew?' · 🏆 新纪录!':' · 最佳 '+Math.max(best,st.score)+' 题')+'</div>'
        +'<div style="text-align:center"><button class="btn btn-pri" id="qzAgain">再来一轮</button></div>';
      document.getElementById("qzAgain").addEventListener("click",function(){renderQuiz(box)});
      return;
    }
    var cur=round[st.i];
    var opts=[cur.wi];
    while(opts.length<4){var r=Math.floor(Math.random()*WORDS_BASE.length);if(opts.indexOf(r)===-1)opts.push(r)}
    opts.sort(function(){return Math.random()-.5});
    var h='<h2 style="margin-bottom:6px"><span class="ic">⚡</span>单词快答</h2>'
      +'<div style="font-size:13px;color:var(--sub);margin-bottom:4px">第 '+st.i+' / 10 题 · 得分 <b style="color:var(--pri)">'+st.score+'</b>'+(st.streak>=2?' · 连击 <b style="color:var(--warm)">'+st.streak+'🔥</b>':'')+'</div>'
      +'<div style="text-align:center;font-size:24px;font-weight:800;margin:14px 0;color:var(--text)">"'+cur.w.cn+'"</div>'
      +'<div style="font-size:12px;color:var(--sub);margin-bottom:10px">选对应的英文单词:</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
      +opts.map(function(oi){return '<button class="qz-btn" data-oi="'+oi+'" style="padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:700;cursor:pointer;transition:var(--tx)">'+esc(WORDS_BASE[oi].en)+'</button>'}).join("")
      +'</div>';
    box.innerHTML=h;
    box.querySelectorAll(".qz-btn").forEach(function(btn){
      btn.addEventListener("click",function(){
        var ok=+btn.dataset.oi===cur.wi;
        btn.style.background=ok?"var(--mint-soft)":"var(--pink-soft)";
        btn.style.borderColor=ok?"var(--mint)":"var(--danger)";
        box.querySelectorAll(".qz-btn").forEach(function(b){b.disabled=true});
        if(ok){st.score++;st.streak++}else{st.streak=0}
        var fb=document.createElement("div");
        fb.textContent=ok?"✓ 正确!":"✗ 正确是 "+cur.w.en;
        fb.style.cssText="text-align:center;font-size:13px;font-weight:700;margin-top:10px;color:"+(ok?"var(--mint)":"var(--danger)");
        box.appendChild(fb);
        setTimeout(function(){st.i++;build()},700);
      });
    });
  }
  build();
}

register("focus",function(){
  var st=load("zsb5_focus",{c:0,d:todayStr()});if(st.d!==todayStr()){st={c:0,d:todayStr()};save("zsb5_focus",st)}
  return '<div class="card gradient-pri"><h2 style="color:var(--pri)"><span class="ic">⏱</span>番茄计时</h2>'

    +'<div class="card timer"><div class="ring-wrap">'
    +'<svg class="ring" viewBox="0 0 240 240"><defs><linearGradient id="fGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--pri)"/><stop offset="100%" stop-color="var(--pink)"/></linearGradient></defs><circle class="ring-bg" cx="120" cy="120" r="104"/><circle class="ring-fg" id="fRing" cx="120" cy="120" r="104"/></svg>'
    +'<div class="ring-num"><div class="num" id="fTime">25:00</div><div class="ring-tip">🍅 专注 25 分钟</div></div>'
    +'</div>'
    +'<div class="ctrls"><button class="btn btn-pri" id="fStart">开始</button><button class="btn" id="fReset">重置</button><button class="btn btn-pri" id="fDone" style="background:linear-gradient(135deg,var(--mint),#059669)">+1 番茄</button></div></div>';
},function(){
  var st=load("zsb5_focus",{c:0,d:todayStr()});if(st.d!==todayStr()){st={c:0,d:todayStr()};save("zsb5_focus",st)}
  var rem=1500,t=null,running=false;
  function fmt(x){return pad(Math.floor(x/60))+":"+pad(x%60)}
  var RING=653.45; /* 圆周长 2πr, r=104 */
  function setRing(frac){var el=document.getElementById("fRing");if(el)el.style.strokeDashoffset=Math.round(RING*(1-frac))}
  document.getElementById("fStart").addEventListener("click",function(){
    if(running){clearInterval(t);t=null;running=false;this.textContent="开始";return}
    running=true;this.textContent="暂停";
    window._focusTimer=t=setInterval(function(){rem--;document.getElementById("fTime").textContent=fmt(Math.max(rem,0));setRing(Math.max(rem,0)/1500);
      if(rem<=0){clearInterval(t);window._focusTimer=null;t=null;running=false;document.getElementById("fStart").textContent="开始";rem=1500;document.getElementById("fTime").textContent=fmt(rem);setRing(1);toast("番茄完成!休息5分钟","ok")}
    },1000);
  });
  document.getElementById("fReset").addEventListener("click",function(){rem=1500;document.getElementById("fTime").textContent=fmt(rem);setRing(1);if(running){clearInterval(t);t=null;running=false;document.getElementById("fStart").textContent="开始"}});
  document.getElementById("fDone").addEventListener("click",function(){st.c=(st.c||0)+1;save("zsb5_focus",st);showPage("focus")});
});

/* ===== 全局搜索(词库/背诵卡/自定义卡/复盘/错题/薄弱点) ===== */
register("search",function(){
  return '<div class="card gradient-pri"><h2 style="color:var(--pri)"><span class="ic">🔍</span>全局搜索</h2>'
    +'<p style="font-size:13px;color:var(--sub)">搜词库 / 背诵卡 / 自定义卡 / 复盘 / 错题 / 薄弱点,一键跳转</p>'
    +'<div style="margin-top:12px;display:flex;gap:8px"><input id="gsearch" class="input" placeholder="输入关键词搜索…" style="flex:1"><button class="btn btn-pri" id="gsearchBtn">搜索</button></div></div>'
    +'<div id="gresult"></div>';
},function(){
  document.getElementById("gsearchBtn").addEventListener("click",function(){doGlobalSearch()});
  document.getElementById("gsearch").addEventListener("keydown",function(e){if(e.key==="Enter")doGlobalSearch()});
  function doGlobalSearch(){
    var q=document.getElementById("gsearch").value.trim().toLowerCase();
    var box=document.getElementById("gresult");
    if(!q){box.innerHTML='<div class="empty"><div class="emo">🔍</div>输入关键词开始搜索</div>';return}
    var out=[];
    /* 词库 */
    allWords().forEach(function(w,i){
      if((w.en+" "+w.cn).toLowerCase().indexOf(q)!==-1){
        out.push({type:"词库",icon:"🗣",t:w.en+" "+w.cn,d:"词库 · 第"+(i+1)+"词",jump:"words"});
      }
    });
    /* 背诵库(内置+自定义) */
    CHEATS.forEach(function(s){
      s.items.forEach(function(it){
        if((it.t+" "+it.body).toLowerCase().indexOf(q)!==-1){
          out.push({type:"背诵卡",icon:"📖",t:it.t,d:s.subj+" · "+it.body.slice(0,40),jump:"cards"});
        }
      });
    });
    load("zsb5_mycards",[]).forEach(function(c){
      if((c.t+" "+c.body).toLowerCase().indexOf(q)!==-1){
        out.push({type:"自定义卡",icon:"✏️",t:c.t,d:c.body.slice(0,40),jump:"cards"});
      }
    });
    /* 复盘 */
    load("zsb4_revs",[]).forEach(function(r){
      if((r.r1+" "+r.r2+" "+r.r3).toLowerCase().indexOf(q)!==-1){
        out.push({type:"复盘",icon:"📔",t:r.date,d:(r.r1+" "+(r.r2||"")).slice(0,40),jump:"rev"});
      }
    });
    /* 错题 */
    load("zsb4_wrongs",[]).forEach(function(r){
      if((r.t+" "+r.r+" "+r.s).toLowerCase().indexOf(q)!==-1){
        out.push({type:"错题",icon:"📕",t:r.t,d:r.subj+" · "+(r.r||"").slice(0,40),jump:"dash"});
      }
    });
    /* 薄弱点 */
    load("zsb4_weaks",[]).forEach(function(r){
      if((r.pt+" "+r.plan).toLowerCase().indexOf(q)!==-1){
        out.push({type:"薄弱点",icon:"🎯",t:r.pt,d:(r.plan||"").slice(0,40),jump:"dash"});
      }
    });
    if(!out.length){box.innerHTML='<div class="empty"><div class="emo">🤷</div>没有找到「'+esc(q)+'」相关的内容</div>';return}
    box.innerHTML='<div class="card"><h2><span class="ic">📋</span>找到 '+out.length+' 条</h2>'
      +out.slice(0,30).map(function(o,i){
        return '<div class="chap" data-gj="'+o.jump+'" data-gi="'+i+'" style="display:flex;align-items:center;gap:10px;cursor:pointer">'
          +'<div style="font-size:18px">'+o.icon+'</div>'
          +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">'+esc(o.t)+'</div><div style="font-size:11px;color:var(--sub)">'+esc(o.d)+'</div></div>'
          +'<span class="chip chip-pri" style="font-size:10px">'+o.type+'</span>'
          +'</div>';
      }).join("")+'</div>';
    /* 点击跳转 */
    var res=out;
    box.querySelectorAll("[data-gj]").forEach(function(el){
      el.addEventListener("click",function(){
        showPage(res[+el.dataset.gi].jump);
      });
    });
  }
});

    +'<input type="file" id="importFile" accept=".json" style="display:none">'
    +'<button class="btn" id="importBtn" style="width:100%">导入备份</button></div>'
    +'<div class="card"><h2><span class="ic">⚠️</span>清空</h2>'
    +'<p style="font-size:13px;color:var(--sub);margin-bottom:10px">清除全部本地数据(慎用)</p>'
    +'<button class="btn" id="clearBtn" style="width:100%;border-color:var(--danger);color:var(--danger)">清空全部数据</button></div>';
},function(){
  document.getElementById("exportBtn").addEventListener("click",function(){
    var data={};Object.keys(localStorage).forEach(function(k){if(k.indexOf("zsb")===0)data[k]=load(k,null)});
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="zsb-backup-"+todayStr()+".json";a.click();toast("已导出 "+Object.keys(data).length+" 项数据","ok");
  });
  document.getElementById("importBtn").addEventListener("click",function(){document.getElementById("importFile").click()});
  document.getElementById("importFile").addEventListener("change",function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){
      try{var data=JSON.parse(r.result);Object.keys(data).forEach(function(k){save(k,data[k])});toast("导入成功,刷新页面","ok");setTimeout(function(){location.reload()},800)}catch(e){toast("文件格式错误","err")}
    };r.readAsText(f);
  });
  document.getElementById("clearBtn").addEventListener("click",function(){
    if(!confirm("确认清空全部本地数据?(不可恢复)"))return;
    if(!confirm("再次确认:所有学习记录将永久删除"))return;
    Object.keys(localStorage).forEach(function(k){if(k.startsWith("zsb"))localStorage.removeItem(k)});
    toast("已清空","ok");setTimeout(function(){location.reload()},800);
  });
});

/* ===== 启动 ===== */
(function(){
  var st=load("zsb5_theme",null);
  if(st)document.body.dataset.theme=st; /* 恢复上次主题选择 */
})();
renderTopHero();
renderTabs();
showPage("home");
</script>
<script>
/* ===== 炫酷特效:粒子背景 / 滚动揭示 / 3D 倾斜 / 按钮涟漪 ===== */
(function(){
function initFX(){
  /* 浮动光球 */
  var orb=document.createElement("div");
  orb.className="bg-orb a";document.body.appendChild(orb);
  var orb2=document.createElement("div");
  orb2.className="bg-orb b";document.body.appendChild(orb2);
  var orb3=document.createElement("div");
  orb3.className="bg-orb c";document.body.appendChild(orb3);

  /* 滚动揭示 */
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting)e.target.classList.add("in")});
  },{threshold:.12});
  window.revealFx=function(){
    document.querySelectorAll(".card,.subject-card,.tool-card,.stat-card,.chap").forEach(function(el){
      if(el.classList.contains("fx-reveal"))return;
      el.classList.add("fx-reveal");io.observe(el);
    });
  };
  window.revealFx();

  /* 学科卡 3D 倾斜 */
  document.querySelectorAll(".subject-card").forEach(function(card){
    card.addEventListener("pointermove",function(e){
      var r=card.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      card.style.transform="perspective(900px) rotateX("+(-y*7)+"deg) rotateY("+(x*7)+"deg) scale(1.02) translateY(-4px)";
    });
    card.addEventListener("pointerleave",function(){card.style.transform=""});
  });

  /* 按钮涟漪 */
  document.addEventListener("click",function(e){
    var t=e.target.closest(".btn,.tool-card,.subject-card,.tabs button");
    if(!t)return;
    var r=t.getBoundingClientRect();
    var s=document.createElement("span");
    s.style.cssText="position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);pointer-events:none;left:"+(e.clientX-r.left)+"px;top:"+(e.clientY-r.top)+"px;width:8px;height:8px;transition:transform .6s,opacity .6s";
    t.appendChild(s);
    requestAnimationFrame(function(){s.style.transform="scale(26)";s.style.opacity="0"});
    setTimeout(function(){s.remove()},650);
  },true);
}
initFX();
})();
</script>
</body>
</html>
